[changelog]
header = "# Changelog\n\n"
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }} ({{ commit.id | truncate(length=7, end="") }})
{%- endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
tag_pattern = "^(v[0-9].*|rewrite-baseline)$"
# rewrite-baseline marks the last TypeScript commit: a boundary for release notes, never a release itself
skip_tags = "^rewrite-baseline$"
sort_commits = "oldest"
# <!-- N --> prefixes are stripped by striptags and only control group order
commit_parsers = [
  { message = "^chore: release", skip = true },
  { message = "^chore\\(deps", skip = true },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^(chore|ci|build|style|test)", group = "<!-- 5 -->Maintenance" },
  { message = ".*", group = "<!-- 6 -->Other" },
]
