# Development docker-compose with hot reloading
# Usage: docker compose -f docker-compose.dev.yml up

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: whatsapp-scheduler-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-whatsapp_scheduler}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-whatsapp_scheduler}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Server with hot reload
  server:
    image: oven/bun:1-alpine
    container_name: whatsapp-scheduler-server-dev
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-whatsapp_scheduler}
    volumes:
      - .:/app
      - server_node_modules:/app/node_modules
      - whatsapp_session_dev:/app/apps/server/whatsapp-session
    ports:
      - "3000:3000"
    command: sh -c "apk add --no-cache python3 make g++ linux-headers && bun install && bun run dev"

  # Web frontend with hot reload
  web:
    image: oven/bun:1-alpine
    container_name: whatsapp-scheduler-web-dev
    working_dir: /app
    environment:
      VITE_API_URL: http://localhost:3000/api
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "bun install && bun run dev:web"

volumes:
  postgres_data_dev:
    name: whatsapp-scheduler-postgres-data-dev
  server_node_modules:
    name: whatsapp-scheduler-server-node-modules
  web_node_modules:
    name: whatsapp-scheduler-web-node-modules
  whatsapp_session_dev:
    name: whatsapp-scheduler-session-dev
