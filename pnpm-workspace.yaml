packages:
  - "apps/*"
  - "packages/*"

# Approved install-time build scripts. Required so native bindings (esbuild,
# sharp, ssh2, protobufjs) and Baileys' postinstall actually run.
allowBuilds:
  baileys: true
  cpu-features: true
  esbuild: true
  protobufjs: true
  sharp: true
  ssh2: true

# Allow these packages even when newer than pnpm's minimum release age window.
minimumReleaseAgeExclude:
  - "@tanstack/query-core@5.100.13"
  - "@tanstack/react-query@5.100.13"
  - "hono@4.12.22"
