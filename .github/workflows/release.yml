name: Release

on:
  push:
    tags: ["v*"]

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    name: Build & push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # flavor latest=auto adds :latest for stable semver tags and skips prereleases
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
        env:
          # default provenance attestation makes the push an index, not a bare manifest
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy via Dokploy
    needs: image
    runs-on: ubuntu-latest
    environment: production
    env:
      DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
      DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
      APPLICATION_ID: ${{ secrets.DOKPLOY_APPLICATION_ID }}
      VERSION: ${{ github.ref_name }}
    steps:
      - name: Point the application at the new image tag
        run: |
          curl --fail-with-body -sS -X POST "$DOKPLOY_URL/api/application.update" \
            -H "x-api-key: $DOKPLOY_API_KEY" -H "content-type: application/json" \
            -d "{\"applicationId\":\"$APPLICATION_ID\",\"dockerImage\":\"$IMAGE:${VERSION#v}\"}"
      - name: Deploy
        run: |
          curl --fail-with-body -sS -X POST "$DOKPLOY_URL/api/application.deploy" \
            -H "x-api-key: $DOKPLOY_API_KEY" -H "content-type: application/json" \
            -d "{\"applicationId\":\"$APPLICATION_ID\",\"title\":\"$VERSION\"}"

  github-release:
    name: GitHub release
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # git-cliff needs the full history and tags to diff the latest release
          fetch-depth: 0
      - name: Release notes from commits
        id: changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip all
        env:
          OUTPUT: RELEASE_NOTES.md
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --notes-file "${{ steps.changelog.outputs.changelog }}" ${{ contains(github.ref_name, '-') && '--prerelease' || '' }}
