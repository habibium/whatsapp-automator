services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: whatsapp_scheduler
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 3000
      WEB_DIST_DIR: /app/apps/web/dist
      DATABASE_URL: postgresql://postgres:postgres@db:5432/whatsapp_scheduler
    ports:
      - "3000:3000"
    depends_on:
      - db

volumes:
  postgres_data:
