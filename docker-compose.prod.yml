# Production stack: app + Postgres. Designed to sit behind Traefik (or any
# HTTPS-terminating reverse proxy). Set the required env vars in a `.env`
# file alongside this compose file — see `.env.example`.

services:
  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
      POSTGRES_DB: ${POSTGRES_DB:-whatsapp_scheduler}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-whatsapp_scheduler}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits: { memory: 512M }
        reservations: { memory: 128M }

  app:
    image: ${APP_IMAGE:-ghcr.io/your-org/whatsapp-message-scheduler:latest}
    restart: always
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      TRUST_PROXY: "true"
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-whatsapp_scheduler}
    networks:
      - internal
      - web
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --tries=1
        - --spider
        - http://localhost:3000/api/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits: { memory: 1G }
        reservations: { memory: 256M }
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wa-scheduler.rule=Host(`${APP_DOMAIN:-localhost}`)"
      - "traefik.http.routers.wa-scheduler.entrypoints=websecure"
      - "traefik.http.routers.wa-scheduler.tls.certresolver=letsencrypt"
      - "traefik.http.services.wa-scheduler.loadbalancer.server.port=3000"

networks:
  internal:
    driver: bridge
    internal: true
  web:
    external: true

volumes:
  postgres_data:
    driver: local
